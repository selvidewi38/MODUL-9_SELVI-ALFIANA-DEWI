<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 16px;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            padding: 24px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        h2 { margin: 0 0 20px; font-size: 22px; }
        label.title {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin: 16px 0 6px;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .hobi label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            font-weight: normal;
        }
        button {
            margin-top: 18px;
            background: #007bff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #0069d9; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Formulir Data Diri</h2>

        <form action="proses_data_diri.php" method="POST">
            <label class="title" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>

            <label class="title" for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>

            <label class="title">Hobi:</label>
            <div class="hobi">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </div>
</body>
</html>
